# ---------------------------------------------------------------
# Simulation configuration: THeMIS-class UGV, long-range run.
# Same decision modules and thresholds as the real-car config;
# only the links (and the sim section at the bottom) differ.
# Every number marked (A) is an ASSUMPTION.
# ---------------------------------------------------------------

# Links, in preference order (first = preferred).
links:
  - name: radio             # tactical mesh radio to the base (fades beyond ~1.5 km)
    id: 1
    nominal_kbps: 8000      # (A) uplink capacity at good signal
    signal_unusable: -88    # (A) dBm; loss passes 3% around here
  - name: starlink          # satellite terminal on the vehicle
    id: 2
    nominal_kbps: 8000      # (A) uplink while moving
    handover_schedule:      # Starlink re-assigns satellites every 15 s at fixed seconds
      period_s: 60
      offsets_s: [12, 27, 42, 57]
      pre_s: 0.5            # (A) duplicate from 0.5 s before ...
      post_s: 1.5           # (A) ... to 1.5 s after each handover
  - name: lte               # opportunistic 4G, patchy
    id: 3
    nominal_kbps: 5000      # (A)
    signal_unusable: -115   # RSRP dBm (A)

# Video quality ladder (MJPEG). kbps values are (A) until measured with
# tools/measure_ladder.py on YOUR cameras and scene.
ladder:
  - {name: PAUSED,  w: 0,   h: 0,   fps: 0,  q: 0,  kbps: 0}
  - {name: TRICKLE, w: 320, h: 240, fps: 1,  q: 40, kbps: 15}
  - {name: L2,      w: 320, h: 240, fps: 10, q: 50, kbps: 300}
  - {name: L3,      w: 320, h: 240, fps: 20, q: 60, kbps: 700}
  - {name: L4,      w: 640, h: 480, fps: 10, q: 55, kbps: 900}
  - {name: L5,      w: 640, h: 480, fps: 20, q: 60, kbps: 2000}

timing:
  loop_hz: 10               # decision loop
  hb_hz: 10                 # heartbeats per link (20 when PREPARE)
  hb_timeout_ms: 300        # heartbeat counts as missed after this
  cmd_hz: 20                # operator command rate

# Fixed limits per traffic type (shared by baseline + proposed)
limits:
  cmd:   {max_rtt_ms: 150, max_loss: 0.05}   # 0.05 = one missed heartbeat in 2 s tolerated
  video: {max_rtt_ms: 300, max_loss: 0.05}

baseline:
  bad_after: 3              # consecutive violating checks -> link bad (~300 ms)
  good_after: 10            # consecutive good checks -> link good (~1 s)
  cam_down_loss: 0.02       # camera steps down when data loss > 2%
  cam_up_after_s: 2.0       # camera steps up after 2 s with no loss
  cam_min_level: 2
  cam_max_level: 5

proposed:
  headroom: 0.8             # use 80% of estimated capacity
  # --- mode detection (A) ---
  reverse_thr: -0.10
  stopped_speed: 0.05
  stopped_for_s: 2.0
  precision_steer: 0.5
  precision_speed: 0.4
  mode_debounce_s: 0.3
  # --- prediction (A) ---
  trend_window_s: 2.0
  trend_consistency: [5, 7] # >=5 of last 7 steps worsening
  margin_base_s: 1.0
  margin_per_speed_s: 1.0   # extra margin at full throttle
  switch_cost_s: 0.3        # (A) measure: time to move a stream to 4G
  hold_s: 3.0               # no moving back for 3 s after a switch
  return_stable_s: 3.0      # preferred link must be usable this long

# Bulk upload shaping, shared by baseline and proposed (what differs between
# them is only urgency ordering and the vehicle-state trade-off)
uploads:
  bulk_budget_share: 0.9    # (A) bulk rate budget: share of the estimated capacity
  queue_guard_ms: 30        # (A) router queue management: bulk capped at the drain
                            #     rate once the backlog exceeds this many ms

# Operator usability requirements per TRUE manoeuvre (from the driver script).
# Read ONLY by the simulator's metrics (sim/engine.py), never by the decision
# modules: usability is defined independently of the controller under test.
# All values (A)  # to be backed by teleoperation literature
requirements:
  DRIVE:     {cam: front, max_age_s: 0.5, min_fps: 10, min_w: 320}
  REVERSE:   {cam: rear,  max_age_s: 0.5, min_fps: 10, min_w: 320}
  PRECISION: {cam: front, max_age_s: 0.5, min_fps: 5,  min_w: 640}
  STOPPED:   {cam: front, max_age_s: 1.0, min_fps: 2,  min_w: 640}

# Needs table: per mode, which streams matter, allowed levels
# (lowest = minimum useful), and their limits in that mode.
modes:
  DRIVE:
    front: {prio: 1, levels: [2, 3, 5], max_rtt_ms: 250, max_loss: 0.05}
    rear:  {prio: 3, levels: [1]}
  PRECISION:
    front: {prio: 1, levels: [4, 5], max_rtt_ms: 300, max_loss: 0.05}
    rear:  {prio: 2, levels: [2, 3]}
  REVERSE:
    rear:  {prio: 1, levels: [2, 3, 5], max_rtt_ms: 250, max_loss: 0.05}
    front: {prio: 3, levels: [1]}
  STOPPED:
    front: {prio: 1, levels: [4, 5], max_rtt_ms: 600, max_loss: 0.10}
    rear:  {prio: 2, levels: [2]}
  HIDE:
    front: {prio: 9, levels: [0]}
    rear:  {prio: 9, levels: [0]}
